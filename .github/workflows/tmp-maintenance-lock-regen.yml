# TEMPORARY maintenance workflow: regenerate Linux authority locks on the
# documented authority platform (Ubuntu / CPython 3.11) because pip-compile
# cannot cross-compile from Windows (docs/DEPENDENCY_REPRODUCIBILITY.md).
# This file is removed from the branch once the regenerated locks are
# committed; it changes nothing about the repository's CI contract.
name: Maintenance lock regen (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  regen-linux-locks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Regenerate Linux authority locks
        working-directory: backend
        run: |
          python -m pip install -r requirements-tooling.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-linux-py311.lock.txt requirements.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-linux-py311.lock.txt requirements.txt requirements-dev.txt

      - name: Upload regenerated locks
        uses: actions/upload-artifact@v4
        with:
          name: linux-locks
          path: |
            backend/requirements-linux-py311.lock.txt
            backend/requirements-dev-linux-py311.lock.txt
          retention-days: 3
