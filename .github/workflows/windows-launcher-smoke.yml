name: Windows launcher smoke

on:
  push:
    branches:
      - feature/research-system-v01
    paths:
      - "Start-Vibe.cmd"
      - "start-vibe.ps1"
      - "tools/windows/**"
      - "backend/app.py"
      - "backend/agent_runtime.py"
      - "agent-runtime/**"
      - "backend/native_intel_service.py"
      - "backend/native_intel_hotlist.py"
      - "backend/native_intel_filter.py"
      - "backend/news_sources.json"
      - "backend/requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - ".github/workflows/windows-launcher-smoke.yml"
  pull_request:
    paths:
      - "Start-Vibe.cmd"
      - "start-vibe.ps1"
      - "tools/windows/**"
      - "backend/app.py"
      - "backend/agent_runtime.py"
      - "agent-runtime/**"
      - "backend/native_intel_service.py"
      - "backend/native_intel_hotlist.py"
      - "backend/native_intel_filter.py"
      - "backend/news_sources.json"
      - "backend/requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - ".github/workflows/windows-launcher-smoke.yml"

concurrency:
  group: windows-launcher-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launcher:
    name: Double-click entry starts and stops both services
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check runtime endpoint resolution and fail-closed validation
        shell: pwsh
        run: pwsh -NoProfile -File tools/windows/test_start_vibe.ps1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev-windows-py312.lock.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            agent-runtime/package-lock.json

      - name: Run the real entry with default and custom runtime endpoints
        shell: pwsh
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-launcher-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-launcher-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/vr-launcher-review.db
          VIBE_RESEARCH_EVIDENCE_THESIS_DB: ${{ runner.temp }}/vr-launcher-evidence.db
          VIBE_NATIVE_INTEL_DB: ${{ runner.temp }}/vr-launcher-native-intel.db
          VIBE_NATIVE_INTEL_DISABLE_STARTUP_FETCH: "1"
          VIBE_NATIVE_INTEL_DISABLE_SCHEDULER: "1"
        run: |
          # Each launch owns and cleans up its services. Dependency markers are
          # reused; no model, login or external provider endpoint is exercised.
          $variants = @(
            @{ Name = "default"; Port = $null; Url = $null },
            @{ Name = "port-only"; Port = "18302"; Url = $null },
            @{ Name = "url-only"; Port = $null; Url = "http://127.0.0.1:18303" }
          )
          foreach ($variant in $variants) {
            Remove-Item Env:VR_AGENT_RUNTIME_PORT -ErrorAction SilentlyContinue
            Remove-Item Env:VR_AGENT_RUNTIME_URL -ErrorAction SilentlyContinue
            if ($null -ne $variant.Port) { $env:VR_AGENT_RUNTIME_PORT = $variant.Port }
            if ($null -ne $variant.Url) { $env:VR_AGENT_RUNTIME_URL = $variant.Url }
            Write-Host "Runtime endpoint smoke: $($variant.Name)"
            & .\Start-Vibe.cmd -SmokeTest -NoBrowser
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Prove launcher cleaned up default and custom ports
        if: always()
        shell: pwsh
        run: |
          foreach ($port in 8911, 18302, 18303, 8900, 5899) {
            $connected = $false
            $client = [System.Net.Sockets.TcpClient]::new()
            try {
              $task = $client.ConnectAsync("127.0.0.1", $port)
              $connected = $task.Wait(500) -and $client.Connected
            }
            catch {
              $connected = $false
            }
            finally {
              $client.Dispose()
            }
            if ($connected) {
              throw "launcher left port $port open"
            }
          }
