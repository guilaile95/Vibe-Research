        timeout-minutes: 5
        env:
          E2E_MARKDOWN_IMAGES_OUTPUT_DIR: ${{ runner.temp }}/markdown-images-evidence
        run: node tests/e2e/markdown-images.browser.mjs

      - name: Preserve synthetic Markdown image guard evidence
