  windows-lock-check:
    name: Python Windows lock check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for saved research replay
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-windows-py312.lock.txt

      - name: Install lock compiler (pinned toolchain)
        working-directory: backend
        run: python -m pip install -r requirements-tooling.txt

      - name: Canonical Windows lock check
        working-directory: backend
        env:
          PIP_CONFIG_FILE: "NUL"
          PIP_NO_INDEX: ""
        run: |
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-windows-py312.lock.txt requirements.txt requirements-dev.txt
          $lockFile = "requirements-dev-windows-py312.lock.txt"
          $lockText = [System.IO.File]::ReadAllText($lockFile)
          $lockText = $lockText.Replace(
            "#    pip-compile --no-emit-index-url --no-index --output-file=requirements-dev-windows-py312.lock.txt requirements-dev.txt requirements.txt",
            "#    pip-compile --no-emit-index-url --output-file=requirements-dev-windows-py312.lock.txt requirements-dev.txt requirements.txt"
          )
          [System.IO.File]::WriteAllText($lockFile, $lockText, [System.Text.UTF8Encoding]::new($false))
          git diff --exit-code -- requirements-dev-windows-py312.lock.txt

      - name: Install backend dependencies (exact Windows lock)
        run: python -m pip install -r backend/requirements-dev-windows-py312.lock.txt

      # Fail early on the affected portability modules; the complete
      # offline selection below remains unchanged and still runs after success.
      - name: Windows adoption portability preflight
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: >-
          python -m pytest -m "not live" -q
          tests/test_company_research_audit.py
          tests/test_test_environment_isolation.py
          tests/test_safe_deep_read_fetch.py
          tests/test_ai_credential_store.py
          tests/test_formal_account_authority_regressions.py
          tests/test_global_metrics_semantics.py
          tests/test_allocation_targets.py
          tests/test_experiment_ledger.py
          tests/test_prediction_journal.py
          tests/test_research_annotations.py
          tests/test_research_quality_diagnostics.py
          tests/test_valuation_digestion_contract.py
          tests/test_filing_evidence.py

      - name: Run offline backend tests
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: python -m pytest -m "not live"

  whitespace:
    name: Whitespace check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed-line whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            base_sha=$(git merge-base \
              "${{ github.sha }}" \
              "origin/${{ github.event.repository.default_branch }}")
            git diff --check "${base_sha}...${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
