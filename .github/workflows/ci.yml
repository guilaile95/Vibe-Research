          MANUAL_NOTES_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/manual-notes-evidence
        run: node --import ./tests/e2e/runtime-env.mjs tests/e2e/manual-notes.browser.mjs

      - name: Preserve synthetic manual research notes screenshots
