name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-linux-py311.lock.txt

      - name: Install backend dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt

      - name: Canonical Python lock check (Linux authority)
        working-directory: backend
        run: |
          python -m pip install -r requirements-tooling.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-linux-py311.lock.txt requirements.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-linux-py311.lock.txt requirements.txt requirements-dev.txt
          git diff --exit-code -- requirements-linux-py311.lock.txt requirements-dev-linux-py311.lock.txt

      - name: Run offline backend tests
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: python -m pytest -m "not live"

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  e2e-smoke:
    name: Playwright smoke E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run stock-data panel smoke E2E
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Run top-risk real E2E
        working-directory: frontend
        run: npm run test:e2e:top-risk

