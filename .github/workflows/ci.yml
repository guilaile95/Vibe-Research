          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: npm run test:e2e:thesis

      - name: Run Current Thesis activation E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run test:e2e:current-thesis

      - name: Run ET1 evidence effective-time E2E
