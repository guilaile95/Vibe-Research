        with:
          name: manual-notes-evidence
          path: ${{ runner.temp }}/manual-notes-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Run evidence edit conflict E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
