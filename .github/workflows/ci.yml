        with:
          name: evidence-edit-conflict-evidence
          path: ${{ runner.temp }}/evidence-edit-conflict-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Run thesis list query and lifecycle E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
