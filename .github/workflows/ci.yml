        run: npm run test:e2e:signals

  windows-lock-check:
    name: Python Windows lock check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-windows-py312.lock.txt

      - name: Install lock compiler (pinned toolchain)
        working-directory: backend
        run: python -m pip install -r requirements-tooling.txt

      - name: TrendRadar client lock check (isolated tree, Windows authority)
        working-directory: backend
        run: |
          python -m piptools compile --no-emit-index-url --output-file=requirements-trendradar-windows-py312.lock.txt requirements-trendradar.txt
          git diff --exit-code -- requirements-trendradar-windows-py312.lock.txt

      - name: Canonical Windows lock check
        working-directory: backend
        run: |
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-windows-py312.lock.txt requirements.txt requirements-dev.txt
          git diff --exit-code -- requirements-dev-windows-py312.lock.txt

      - name: Install backend dependencies (exact Windows lock)
        run: python -m pip install -r backend/requirements-dev-windows-py312.lock.txt

      - name: Install TrendRadar MCP client (isolated venv, zero pollution)
        working-directory: backend
        shell: bash
        run: |
          # 与主测试环境物理隔离：mcp 依赖树禁止触碰主解释器任何包。
          python -m venv "$RUNNER_TEMP/tr-mcp-probe"
          "$RUNNER_TEMP/tr-mcp-probe/Scripts/python.exe" -m pip install --quiet -r requirements-trendradar-windows-py312.lock.txt
          "$RUNNER_TEMP/tr-mcp-probe/Scripts/python.exe" -c "import mcp; from mcp.client.streamable_http import streamablehttp_client; print('trendradar mcp client import ok (windows, isolated venv)')"

      - name: Run offline backend tests
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: python -m pytest -m "not live"

  whitespace:
    name: Whitespace check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed-line whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            base_sha=$(git merge-base \
              "${{ github.sha }}" \
              "origin/${{ github.event.repository.default_branch }}")
            git diff --check "${base_sha}...${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
