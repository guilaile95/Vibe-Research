name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-linux-py311.lock.txt

      - name: Install backend dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt

      - name: Canonical Python lock check (Linux authority)
        working-directory: backend
        run: |
          python -m pip install -r requirements-tooling.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-linux-py311.lock.txt requirements.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-linux-py311.lock.txt requirements.txt requirements-dev.txt
          git diff --exit-code -- requirements-linux-py311.lock.txt requirements-dev-linux-py311.lock.txt

      - name: TrendRadar MCP client Linux compat probe (pinned install)
        working-directory: backend
        run: |
          # 独立一次性 venv：绝不污染主测试环境（mcp 树会把 httpx 升级，
          # 与主锁的 httpx==0.25.2 共存会改变既有 API 测试行为）。
          python -m venv "$RUNNER_TEMP/tr-mcp-probe"
          "$RUNNER_TEMP/tr-mcp-probe/bin/python" -m pip install --quiet "mcp==1.16.0"
          "$RUNNER_TEMP/tr-mcp-probe/bin/python" -c "import mcp; from mcp.client.streamable_http import streamablehttp_client; print('trendradar mcp client import ok on linux py3.11')"

      - name: Run offline backend tests
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: python -m pytest -m "not live"

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  e2e-smoke:
    name: Playwright smoke E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Run stock-data panel smoke E2E
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Run top-risk real E2E
        working-directory: frontend
        run: npm run test:e2e:top-risk

      - name: Run Candidate Research E2E
        working-directory: frontend
        run: npm run test:e2e:candidate-campaign

  e2e-thesis-smoke:
