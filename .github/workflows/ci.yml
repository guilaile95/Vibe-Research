name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-linux-py311.lock.txt

      - name: Install backend dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt

      - name: Canonical Python lock check (Linux authority)
        working-directory: backend
        run: |
          python -m pip install -r requirements-tooling.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-linux-py311.lock.txt requirements.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-linux-py311.lock.txt requirements.txt requirements-dev.txt
          git diff --exit-code -- requirements-linux-py311.lock.txt requirements-dev-linux-py311.lock.txt

      - name: Run offline backend tests
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: python -m pytest -m "not live"

  # ---- TEMP P0-SEC2-R1 DIAGNOSTIC (removed after root cause found) ----
  diagnose:
    name: Diagnose ${{ matrix.phase }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: A_SEC2_CORE
            pytest_args: tests/test_cli_runtime_security.py
          - phase: B_DAILY_REVIEW
            pytest_args: tests/test_daily_review_ai_api.py
          - phase: C_OTHER_REGRESS
            pytest_args: tests/test_api.py tests/test_fixes.py tests/test_portfolio_advice_error_mapping.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev-linux-py311.lock.txt
      - name: Install deps
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt
      - name: Run phase tests (180s bounded)
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: |
          timeout 180 python -m pytest -vv -s ${{ matrix.pytest_args }} -m "not live" || true

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  e2e-smoke:
    name: Playwright smoke E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run stock-data panel smoke E2E
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Run top-risk real E2E
        working-directory: frontend
        run: npm run test:e2e:top-risk

  e2e-thesis-smoke:
    name: Playwright thesis smoke E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-linux-py311.lock.txt

      - name: Install backend dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run evidence-thesis real E2E
        working-directory: frontend
        env:
          PYTHON: python
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: npm run test:e2e:thesis

  e2e-data-health-smoke:
    name: Playwright data health smoke E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-linux-py311.lock.txt

      - name: Install backend dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run data health real E2E
        working-directory: frontend
        env:
          PYTHON: python
          VR_DATA_DIR: ${{ runner.temp }}/vr-dh-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-dh-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/vr-dh-review.db
          VIBE_RESEARCH_EVIDENCE_THESIS_DB: ${{ runner.temp }}/vr-dh-evidence.db
        run: npm run test:e2e:data-health

  e2e-intel-digest-smoke:
    name: Playwright Intel digest E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-linux-py311.lock.txt

      - name: Install backend dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Intel digest real E2E
        working-directory: frontend
        env:
          PYTHON: python
          VR_DATA_DIR: ${{ runner.temp }}/vr-intel-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-intel-reports
        run: npm run test:e2e:intel-digest

  windows-lock-check:
    name: Python Windows lock check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-windows-py312.lock.txt

      - name: Install lock compiler (pinned toolchain)
        working-directory: backend
        run: python -m pip install -r requirements-tooling.txt

      - name: Canonical Windows lock check
        working-directory: backend
        run: |
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-windows-py312.lock.txt requirements.txt requirements-dev.txt
          git diff --exit-code -- requirements-dev-windows-py312.lock.txt

      - name: Install backend dependencies (exact Windows lock)
        run: python -m pip install -r backend/requirements-dev-windows-py312.lock.txt

      - name: Run offline backend tests
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: python -m pytest -m "not live"

  whitespace:
    name: Whitespace check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed-line whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            base_sha=$(git merge-base \
              "${{ github.sha }}" \
              "origin/${{ github.event.repository.default_branch }}")
            git diff --check "${base_sha}...${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
