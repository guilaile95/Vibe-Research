name: CI

on:
  push:
    branches:
      - feature/research-system-v01
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for saved research replay
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-linux-py311.lock.txt

      - name: Install backend dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-dev-linux-py311.lock.txt

      - name: Canonical Python lock check (Linux authority)
        working-directory: backend
        run: |
          python -m pip install -r requirements-tooling.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-linux-py311.lock.txt requirements.txt
          python -m piptools compile --no-emit-index-url --output-file=requirements-dev-linux-py311.lock.txt requirements.txt requirements-dev.txt
          git diff --exit-code -- requirements-linux-py311.lock.txt requirements-dev-linux-py311.lock.txt

      - name: Run offline backend tests
        working-directory: backend
        env:
          VR_DATA_DIR: ${{ runner.temp }}/vr-data
          VR_REPORTS_DIR: ${{ runner.temp }}/vr-reports
          VIBE_RESEARCH_REVIEW_DB: ${{ runner.temp }}/review.db
        run: python -m pytest -m "not live"

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  agent-runtime:
    name: Agent Runtime tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json

      - name: Install Agent Runtime dependencies
        working-directory: agent-runtime
        run: npm ci

      - name: Run Agent Runtime tests
        working-directory: agent-runtime
        run: npm test

  e2e-smoke:
    name: Playwright smoke E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-linux-py311.lock.txt

      - name: Install backend runtime dependencies (exact Linux lock)
        run: python -m pip install -r backend/requirements-linux-py311.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        id: browser_prerequisites
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Run stock-data panel smoke E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        env:
          E2E_KLINE_RESEARCH_SCREENSHOT_DIR: kline-research-evidence
        run: npm run test:e2e:smoke

      - name: Save synthetic K-line research viewport evidence
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: kline-research-evidence
          path: frontend/kline-research-evidence/kline-research-synthetic-*.png
          if-no-files-found: error

      - name: Run public-source research Intel page acceptance
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          PUBLIC_RESEARCH_BROWSER_OUTPUT_DIR: public-research-evidence
        run: npm run test:e2e:public-research

      - name: Save public-source synthetic viewport evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-research-evidence
          path: |
            frontend/public-research-evidence/*.png
            frontend/public-research-evidence/*.html
            frontend/public-research-evidence/*.json
          if-no-files-found: error

      - name: Run extended archive research mounted-page acceptance
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          EXTENDED_PUBLIC_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/extended-public-research-evidence
        run: node --import ./tests/e2e/runtime-env.mjs tests/e2e/extended-public-research.browser.mjs

      - name: Preserve extended archive research page evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-public-research-evidence
          path: ${{ runner.temp }}/extended-public-research-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Run layout navigation and mobile scroll acceptance
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          LAYOUT_NAV_EVIDENCE_DIR: ${{ runner.temp }}/layout-navigation-evidence
        run: node --import ./tests/e2e/runtime-env.mjs tests/e2e/layout-navigation.browser.mjs

      - name: Preserve layout navigation geometry evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-navigation-evidence
          path: |
            ${{ runner.temp }}/layout-navigation-evidence/*.png
            ${{ runner.temp }}/layout-navigation-evidence/*.html
            ${{ runner.temp }}/layout-navigation-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Run two-company comparison mounted-page acceptance
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          COMPANY_COMPARISON_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/company-comparison-evidence
        run: node --import ./tests/e2e/runtime-env.mjs tests/e2e/company-comparison.browser.mjs

      - name: Preserve two-company comparison synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: company-comparison-evidence
          path: ${{ runner.temp }}/company-comparison-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Run research analytics production page acceptance
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          RESEARCH_ANALYTICS_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/research-analytics-evidence
        run: node --import ./tests/e2e/runtime-env.mjs tests/e2e/research-analytics.browser.mjs

      - name: Preserve research analytics synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-analytics-evidence
          path: ${{ runner.temp }}/research-analytics-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Run core navigation smoke E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:core-navigation

      - name: Run top-risk real E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:top-risk

      - name: Run Candidate Research E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:candidate-campaign

      - name: Run Dragon-Tiger Market Discovery E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:dragon-tiger-discovery

      - name: Preserve synthetic Dragon-Tiger evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dragon-tiger-discovery-evidence
          path: docs/screenshots/dragon-tiger-discovery1-r2
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Pattern Discovery E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:patterns

      - name: Run Factor Validation E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run test:e2e:factor-validation

      - name: Run bounded workflow recovery E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          WORKFLOW_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/workflow-recovery-evidence
          WORKFLOW_RECOVERY_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:e2e:workflow-recovery

      - name: Preserve workflow recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-recovery-evidence
          path: ${{ runner.temp }}/workflow-recovery-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Run delayed factor navigation regression E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/factor-navigation-evidence
        run: npm run test:e2e:factor-navigation

      - name: Preserve factor navigation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factor-navigation-evidence
          path: ${{ runner.temp }}/factor-navigation-evidence
          if-no-files-found: warn

      - name: Run historical signal experiment save and comparison E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          VR_E2E_PYTHON: python
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/historical-experiment-evidence
        run: npm run test:e2e:historical-signal-validation

      - name: Preserve historical experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-experiment-evidence
          path: ${{ runner.temp }}/historical-experiment-evidence
          if-no-files-found: warn

      - name: Run synthetic K-line inspection component E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        run: node --import ./tests/e2e/runtime-env.mjs tests/e2e/kline-inspection.browser.mjs

      - name: Run synthetic adoption component workflows E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/adoption-workflow-evidence
        run: node --import ./tests/e2e/runtime-env.mjs tests/e2e/adoption-workflows.browser.mjs

      - name: Preserve synthetic adoption component evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adoption-workflow-evidence
          path: ${{ runner.temp }}/adoption-workflow-evidence
          if-no-files-found: warn

      - name: Run Full-Market Discovery E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:discovery

      - name: Run full-market source and screener coverage E2E
        if: ${{ !cancelled() && steps.browser_prerequisites.outcome == 'success' }}
        working-directory: frontend
        timeout-minutes: 5
        env:
          VR_E2E_PYTHON: python
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screener-coverage-evidence
        run: npm run test:e2e:full-market

      - name: Preserve synthetic screener coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screener-coverage-evidence
          path: ${{ runner.temp }}/screener-coverage-evidence
          if-no-files-found: warn

  e2e-thesis-smoke:
    name: Playwright thesis smoke E2E
