schema_version: top-risk-analysis-v0.1
# 顶部风险分析链路配置（声明式）。
# 与旧 SignalModule / CATEGORY_WEIGHT / aggregator 无关；
# 每个步骤由 top_risk_evaluators.EVALUATORS 中的同名函数实现。
# weight 仅用于风险分加权，不影响风险分数的理论范围（0-100）。
steps:
  - id: narrative_divergence
    label: 叙事背离
    evaluator: narrative_divergence
    weight: 1.0
    params:
      # Phase 1 无可靠舆情来源：sentiment_series 缺失时该步骤 skipped。
      sentiment_required: true

  - id: crowding
    label: 拥挤度
    evaluator: crowding
    weight: 1.2
    params:
      margin_window: 20          # 融资余额对比窗口（交易日）
      margin_rise_threshold: 0.25  # 融资余额相对窗口初值上涨 >=25% 视为拥挤信号
      turnover_z_threshold: 2.0  # 近期均量相对长基线 z 分数阈值

  - id: runup_exhaustion
    label: 涨幅耗竭
    evaluator: runup_exhaustion
    weight: 1.2
    params:
      window: 60                # 回看窗口（与 kline offset 对齐）
      runup_strong: 0.5         # 区间涨幅 >=50% 视为强
      runup_medium: 0.25        # 区间涨幅 >=25% 视为中
      vol_shrink_ratio: 0.7     # 末期均量 / 早期均量 <=0.7 视为量能萎缩

  - id: catalyst_priced_in
    label: 利好兑现
    evaluator: catalyst_priced_in
    weight: 1.0
    params:
      # Phase 1 无可靠事件来源：events 缺失时该步骤 skipped。
      events_required: true

  - id: valuation_cap
    label: 估值硬顶
    evaluator: valuation_cap
    weight: 1.0
    params:
      pe_percentile_high: 90.0   # PE-TTM 历史分位 >=90% 视为估值硬顶
      pb_percentile_high: 90.0   # PB 历史分位 >=90% 视为估值硬顶
